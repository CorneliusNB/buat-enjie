<style>
:root{
  /* Layout: one pixel-art screen set in a pastel handheld shell on a starry night; portrait phones get Game Boy style controls underneath, landscape phones get thumb buttons in the corners. */
  --night:#140d2b;
  --plum:#2b1a3d;
  --rose:#ff6f91;
  --hot:#ff4f7b;
  --blush:#ffc2d4;
  --shell:#ffc2d4;
  --shell-dark:#f39bb6;
  --cream:#fff4e6;
  --gold:#ffd166;
  --aqua:#6ff7ff;
  --f-body:'Pixelify Sans', ui-rounded, 'Trebuchet MS', system-ui, sans-serif;
  --f-ui:'Silkscreen', 'Pixelify Sans', ui-monospace, monospace;
  --u:2px;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{
  height:100%;margin:0;overflow:hidden;overscroll-behavior:none;
  color:var(--cream);font-family:var(--f-body);
  background-color:var(--night);
  background-image:
    radial-gradient(circle at 12% 18%, #fff 0 1px, transparent 1.6px),
    radial-gradient(circle at 63% 41%, #ffd6e4 0 1px, transparent 1.6px),
    radial-gradient(circle at 37% 77%, #fff 0 1px, transparent 1.6px),
    radial-gradient(circle at 88% 9%, #bff6ff 0 1px, transparent 1.6px),
    radial-gradient(ellipse at 50% 115%, #4a2160 0%, transparent 62%);
  background-size:170px 170px,230px 230px,190px 190px,260px 260px,100% 100%;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
#app{
  height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding-block:12px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
#console{display:flex;flex-direction:column;align-items:center;gap:16px;position:relative}
#screen{
  position:relative;overflow:hidden;background:var(--plum);touch-action:none;
  box-shadow:0 0 0 3px var(--plum),0 0 0 6px var(--blush),0 0 0 9px var(--plum),0 14px 40px #0009;
}
#game{display:block;width:100%;height:100%;image-rendering:-moz-crisp-edges;image-rendering:pixelated}

/* ---------- handheld shell (portrait phones) ---------- */
#app[data-mode="below"] #console{
  background:linear-gradient(var(--shell),var(--shell-dark));
  padding:20px 18px 18px;border-radius:16px 16px 48px 16px;
  box-shadow:0 0 0 3px var(--plum),0 8px 0 0 #c86f8d,0 8px 0 3px var(--plum),0 24px 50px #000a;
}
#brand{display:none;font-family:var(--f-ui);font-size:11px;letter-spacing:.12em;color:#9b4565;align-self:flex-start;margin-top:-6px}
#app[data-mode="below"] #brand{display:block}

/* ---------- touch controls ---------- */
#controls{display:none;touch-action:none}
#app[data-mode="below"] #controls{display:flex;width:100%;justify-content:space-between;align-items:center;padding:4px 6px 0}
#app[data-mode="overlay"] #controls{
  display:flex;position:fixed;inset:auto 0 0 0;justify-content:space-between;align-items:flex-end;pointer-events:none;z-index:20;
  padding-bottom:calc(env(safe-area-inset-bottom, 0px) + 14px);
  padding-left:calc(max(16px, env(safe-area-inset-left, 0px)) + 10px);
  padding-right:calc(max(16px, env(safe-area-inset-right, 0px)) + 10px);
}
#app[data-mode="overlay"] #controls > *{pointer-events:auto;opacity:.62}
#pad{display:flex;gap:10px}
.pbtn{
  width:64px;height:64px;display:grid;place-items:center;background:var(--plum);
  box-shadow:inset 0 -5px 0 #170d24,0 0 0 3px #170d24;border-radius:10px;
}
.pbtn svg{width:26px;height:26px}
.pbtn.on{transform:translateY(3px);box-shadow:inset 0 -2px 0 #170d24,0 0 0 3px #170d24;background:#3d2754}
#jumpWrap{display:flex;flex-direction:column;align-items:center;gap:6px}
#jumpBtn{
  width:80px;height:80px;border-radius:50%;border:0;background:var(--hot);color:var(--cream);
  font-family:var(--f-ui);font-size:26px;box-shadow:inset 0 -6px 0 #c22d58,0 0 0 3px var(--plum);touch-action:none;
}
#jumpBtn.on{transform:translateY(3px);box-shadow:inset 0 -2px 0 #c22d58,0 0 0 3px var(--plum)}
#jumpWrap span{font-family:var(--f-ui);font-size:11px;color:#9b4565;letter-spacing:.1em}
#app[data-mode="overlay"] #jumpWrap span{display:none}

#hint{display:none;font-family:var(--f-ui);font-size:12px;color:#c9b6e8;letter-spacing:.06em;text-align:center}
#app[data-mode="desk"] #hint{display:block}
#hint b{color:var(--blush);font-weight:400}

/* ---------- in-screen UI, sized in game pixels (--u) ---------- */
#hud{
  position:absolute;inset:0 0 auto 0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
  padding:calc(var(--u)*4) calc(var(--u)*4);pointer-events:none;
  font-family:var(--f-ui);font-size:max(11px, calc(var(--u)*5.5));
}
.chips{display:flex;gap:calc(var(--u)*3)}
.chip{

  box-shadow:0 0 0 2px var(--plum);font-variant-numeric:tabular-nums;
}
.chip svg{width:1.05em;height:1.05em}
#mute{pointer-events:auto;cursor:pointer;border:0;font:inherit;line-height:1}
#mute:focus-visible,.btn:focus-visible,.pbtn:focus-visible,#jumpBtn:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

#zoneLabel{
  position:absolute;left:0;right:0;top:22%;text-align:center;pointer-events:none;
  font-family:var(--f-body);font-weight:700;font-size:max(18px, calc(var(--u)*13));
  color:var(--cream);text-shadow:calc(var(--u)*1) calc(var(--u)*1) 0 var(--hot),calc(var(--u)*2) calc(var(--u)*2) 0 var(--plum);

}
#zoneLabel small{display:block;font-family:var(--f-ui);font-weight:400;font-size:.42em;letter-spacing:.14em;color:var(--blush);text-shadow:1px 1px 0 var(--plum)}
#zoneLabel.show{opacity:1;transform:none}

#toast{
  position:absolute;left:50%;top:40%;transform:translate(-50%,0);pointer-events:none;
  font-family:var(--f-ui);font-size:max(12px, calc(var(--u)*6));background:var(--plum);color:var(--blush);

}
#toast.show{opacity:1}

.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(var(--u)*6)}
.paper{

  padding:.8em 1.1em .7em;

  animation:pop .35s cubic-bezier(.2,1.6,.4,1);
}
@keyframes pop{from{transform:scale(.6) rotate(-3deg);opacity:0}to{transform:none;opacity:1}}
.tag{display:flex;align-items:center;gap:.5em;font-family:var(--f-ui);font-size:.62em;letter-spacing:.08em;color:var(--hot);line-height:1.3}
.tag svg{width:1.6em;height:1.6em;flex:none}
.paper h2{margin:.15em 0 .2em;font-size:1.25em;line-height:1.25;font-weight:700;text-wrap:balance}
#letterBody{margin:0;white-space:pre-wrap;min-height:3.2em;font-weight:500}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:.3em;font-family:var(--f-ui);font-size:.55em;color:#9b4565;letter-spacing:.06em}
.arrow{display:inline-block;width:0;height:0;border-left:.5em solid transparent;border-right:.5em solid transparent;border-top:.55em solid var(--hot);animation:bob 0.8s steps(2) infinite;margin-left:.5em;vertical-align:middle}
@keyframes bob{50%{transform:translateY(3px)}}
#letter .paper{cursor:pointer}

#title{flex-direction:column;gap:calc(var(--u)*4);text-align:center;background:linear-gradient(#140d2b22,#140d2bdd 75%)}

.couple{display:flex;align-items:flex-end;gap:calc(var(--u)*5)}

.btn{
  font-family:var(--f-ui);font-size:max(13px, calc(var(--u)*7));color:var(--cream);background:var(--hot);border:0;cursor:pointer;

.btn:active{transform:translateY(2px);box-shadow:inset 0 -.1em 0 #c22d58,0 0 0 3px var(--plum)}
.btn svg{width:1em;height:1em}
.btn.alt{background:var(--plum);box-shadow:inset 0 -.25em 0 #170d24,0 0 0 3px var(--blush)}
#title small{font-family:var(--f-ui);font-size:max(10px, calc(var(--u)*4));color:#c9b6e8;letter-spacing:.05em}

#question{flex-direction:column;gap:calc(var(--u)*6);background:#140d2b99}
#question .paper{text-align:center;width:min(100%, 420px)}
.qbtns{display:flex;flex-direction:column;gap:.9em;align-items:stretch;margin-top:.7em}
.qbtns .btn{justify-content:center;white-space:normal;line-height:1.3;font-family:var(--f-body);font-weight:600;font-size:max(14px, calc(var(--u)*7))}
.qbtns .btn:hover{background:#3d2754}

#endCard{background:#140d2b66}
#endCard .paper{text-align:center;width:min(100%, 460px)}
#endCard .stats{font-family:var(--f-ui);font-size:.6em;color:#9b4565;margin:.6em 0}
#endBody{margin:.2em 0 .4em;white-space:pre-wrap}

@media (prefers-reduced-motion: reduce){
  .couple img,.couple .mid,.arrow{animation:none}
  .paper{animation:none}
}

<script>
(() => {
'use strict';
document.documentElement.lang = 'id';

/* =====================================================================
   KATA-KATAMU DI SINI  (your words go here)

const STORY = {

    { place: 'dari layar bioskop', text:

  ],
  finalePlace: 'langsung dari gw',
  finale: `Sekali lagi, maafin gw ya enjie buat semua hal yang bikin lu sedih sama capek kemaren. Ngga ada tuntutan apa apa dari game ini, ambil waktu sebanyak yang lu butuhin.`,
  choices: [
    { label: 'Gw butuh waktu lagi', reply:
      `Gappaa banget enjie. Take all the time you need, gw bakal tetep hargain ruang lu sama jaga diri baik baik.` },

      `Makasih ya udah mau ngobrol sama gw, udah mau sabar sama gw padahal tingkah laku gw yang begitu, tolong maafin gw ya enjie. I love you so much` },

const UI = {
  sub: 'game kecil dari gw',
  start: 'Mulai', cont: 'Lanjut',
  letterTag: (i, n, place) => `surat ${i} dari ${n} · ${place}`,
  finaleTag: (n, place) => `surat ${n} dari ${n} · ${place}`,
  oops: 'coba lagi', splash: 'coba lagi',
  stats: (h, ht) => `hati yang lu kumpulin: ${h} dari ${ht}`,
  muteOn: 'Matikan musik', muteOff: 'Nyalakan musik',
};

/* ---------------------------------------------------------------------
   constants & helpers
--------------------------------------------------------------------- */
const TILE = 12, VH = 180, WT = 530, WORLD_W = WT * TILE, GY = 13 * TILE;
const BOUNDS = [88, 176, 264, 352, 440], BLEND = 11, NZ = 6;
const ZONES = [
  { name: 'Akuarium Bawah Laut', sub: 'babak satu' },
  { name: 'Danau Citra 8', sub: 'babak dua' },
  { name: 'Dufan', sub: 'babak tiga' },
  { name: 'Bioskop', sub: 'babak empat' },
  { name: 'Bundaran HI', sub: 'babak lima' },
  { name: 'Sushi Yay', sub: 'babak enam' },
];
const $ = id => document.getElementById(id);
const cv = $('game'), ctx = cv.getContext('2d');
let W = 320, tm = 0, mt = 0;
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const hash = n => { const s = Math.sin(n * 12.9898 + 78.233) * 43758.5453; return s - Math.floor(s); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function weights(tx) {
  // each boundary fades one zone into the next; blends never overlap, so the weights sum to 1
  const sm = BOUNDS.map(b => smooth(b - BLEND, b + BLEND, tx)), w = new Array(NZ);
  w[0] = 1 - sm[0]; for (let k = 1; k < NZ - 1; k++) w[k] = sm[k - 1] - sm[k]; w[NZ - 1] = sm[NZ - 2];
  return w;
}
const zoneOf = tx => { let z = 0; while (z < NZ - 1 && tx >= BOUNDS[z]) z++; return z; };
function dominant(tx) { const w = weights(tx); let b = 0; for (let i = 1; i < NZ; i++) if (w[i] > w[b]) b = i; return b; }
function mixZone(tx, ty) { const w = weights(tx + .5); const h = hash(tx * 7.31 + ty * 3.17); let acc = 0; for (let i = 0; i < NZ; i++) { acc += w[i]; if (h < acc) return i; } return NZ - 1; }

function R(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.floor(x), Math.floor(y), w, h); }
function pcirc(cx, cy, r, c) {
  ctx.fillStyle = c; cx = Math.floor(cx); cy = Math.floor(cy); r = Math.max(0, r | 0);
  for (let dy = -r; dy <= r; dy++) { const hw = Math.floor(Math.sqrt(r * r - dy * dy) + .35); ctx.fillRect(cx - hw, cy + dy, hw * 2 + 1, 1); }
}
function pell(cx, cy, rx, ry, c) {
  ctx.fillStyle = c; cx = Math.floor(cx); cy = Math.floor(cy);
  for (let dy = -ry; dy <= ry; dy++) { const hw = Math.floor(rx * Math.sqrt(Math.max(0, 1 - (dy / (ry + .5)) ** 2))); ctx.fillRect(cx - hw, cy + dy, hw * 2 + 1, 1); }
}
function ring(cx, cy, r, c, step) { for (let a = 0; a < Math.PI * 2; a += step || .05) R(cx + Math.cos(a) * r, cy + Math.sin(a) * r, 1, 1, c); }
function line(x0, y0, x1, y1, c) { const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) | 0; for (let i = 0; i <= n; i++) R(x0 + (x1 - x0) * i / (n || 1), y0 + (y1 - y0) * i / (n || 1), 1, 1, c); }
function glow(x, y, r, c, a) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha *= a;
  pcirc(x, y, r, c); ctx.globalAlpha *= .6; pcirc(x, y, Math.max(1, (r * .6) | 0), c); ctx.restore();
}
function beam(pts, c, a) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha *= a; ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]); ctx.fill(); ctx.restore(); }
const t = () => tm / 60;

/* ---------------------------------------------------------------------
   pixel font (3x5) for signs
--------------------------------------------------------------------- */
const GLYPH = {};

function buildVignette() {
  vignette = document.createElement('canvas'); vignette.width = W; vignette.height = VH;
  const g = vignette.getContext('2d'), gr = g.createRadialGradient(W / 2, VH / 2, VH * .45, W / 2, VH / 2, W * .75);
  gr.addColorStop(0, 'rgba(20,13,43,0)'); gr.addColorStop(1, 'rgba(20,13,43,.55)'); g.fillStyle = gr; g.fillRect(0, 0, W, VH);
}

function render() {
  const cx = Math.round(camX);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(skyCv, clamp(cx, 0, WORLD_W - W), 0, W, VH, 0, 0, W, VH);
  drawSkyExtras(cx);
  drawLayer(far, .3, cx);
  drawBands(cx);
  drawLayer(mid, .6, cx);
  drawPool(cx);
  drawNear(cx);
  for (const m of movers) drawMover(m, cx);
  for (const s of solids) drawSolid(s, cx);
  for (const b of blocks) drawBlock(b, cx);
  for (const l of letters) drawLetterPickup(l, cx);
  for (const h of hearts) drawHeartPickup(h, cx);
  for (const e of enemies) drawEnemy(e, cx);
  drawHim(cx);
  if (state !== 'title') drawPlayer(cx);
  drawParts(cx);
  ctx.drawImage(vignette, 0, 0);
  if (state === 'respawn') { ctx.globalAlpha = 1 - Math.abs(respawnT - 22) / 22; R(0, 0, W, VH, '#2b1a3d'); ctx.globalAlpha = 1; }
}

function update() {
  tm++;
  const frozen = state === 'letter' || state === 'question';
  if (!frozen) updateMovers();
  if (state === 'title') {
    const span = WORLD_W - W, k = (tm * 1.1) % (span * 2); camX = k < span ? k : span * 2 - k;
  } else if (state === 'play' || state === 'finale' || state === 'end') {
    if (fin.phase === 'after' && fin.choice === 1 && fin.t === 40 && P.onGround) P.vy = -2.6;
    updatePlayer();
    if (state === 'play' && !cipantat) {
      if (P.onGround && Math.abs(P.vx) < .05 && P.x + P.w > SIGN_X0 && P.x < SIGN_X1) {
        if (++signT >= 300) { cipantat = true; sparkle(SIGN_X0 + 22, GY - 12, 14, '#ffd166'); Snd.block(); }
      } else signT = 0;
    }
    if (state === 'play') { updatePickups(); checkZone(); if (P.x >= FINALE_X && !fin.on && P.onGround) startFinale(); }
  } else if (state === 'respawn') {
    respawnT++;
    if (respawnT === 22) { P.x = cp.x; P.y = cp.y; P.vx = P.vy = 0; P.hurt = 60; P.ride = null; P.splashed = false; camX = clamp(P.x - W * .4, 0, WORLD_W - W); }
    if (respawnT >= 44) state = 'play';
  } else if (state === 'letter') updateDlg();
  if (fin.on) updateFinale();
  updateEnemies();
  for (const b of blocks) if (b.bump > 0) b.bump--;
  ambient(); updateParts();
  if (state !== 'title' && state !== 'respawn') {
    const target = fin.on ? (HER_STOP + HIM_X) / 2 + 6 - W / 2 : P.x + 4 - W * .42 + P.face * 16;
    camX += (target - camX) * .09; camX = clamp(camX, 0, WORLD_W - W);
  }
}

let last = 0, acc = 0;
function frame(now) {
  if (!last) last = now; acc += Math.min(100, now - last); last = now;
  let n = 0; while (acc >= 1000 / 60 && n < 5) { update(); acc -= 1000 / 60; n++; }
  if (n === 5) acc = 0;
  render(); requestAnimationFrame(frame);
}

/* ---------------------------------------------------------------------
   layout: size the pixel screen to the device
--------------------------------------------------------------------- */
function layout() {
  const app = $('app'), cs = getComputedStyle(app);
  const touch = matchMedia('(pointer: coarse)').matches || (navigator.maxTouchPoints > 0 && !matchMedia('(pointer: fine)').matches);
  const mode = touch ? (innerHeight > innerWidth ? 'below' : 'overlay') : 'desk';
  app.dataset.mode = mode;
  const aw0 = app.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const ah0 = app.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  let aw = aw0 - 20, ah = ah0 - 20;
  if (mode === 'below') { const ctrl = clamp(ah0 * .3, 130, 210); aw -= 36; ah = ah0 - ctrl - 80; $('controls').style.height = ctrl + 'px'; }
  else $('controls').style.height = '';
  if (mode === 'desk') ah -= 34;
  let s = ah / VH; if (aw / s < 200) s = aw / 200;
  if (mode === 'desk' && s >= 2) s = Math.floor(s);
  s = Math.max(s, .8);
  W = clamp(Math.floor(aw / s), 200, mode === 'below' ? 300 : 400);
  cv.width = W; cv.height = VH; ctx.imageSmoothingEnabled = false;
  const scr = $('screen'); scr.style.width = Math.round(W * s) + 'px'; scr.style.height = Math.round(VH * s) + 'px';
  document.documentElement.style.setProperty('--u', s.toFixed(3) + 'px');
  buildVignette(); camX = clamp(camX, 0, WORLD_W - W);
}

/* ---------------------------------------------------------------------
   boot
--------------------------------------------------------------------- */
function snapshot() {
  return { started: state !== 'title', cp, hearts: hearts.map(h => h.got ? 1 : 0).join(''), blocks: blocks.map(b => b.used ? 1 : 0).join(''), letters: letters.map(l => l.read ? 1 : 0).join('') };
}
function beginPlay() {
  if (state !== 'title' && state !== 'end') return;
  Snd.init(); Snd.unlock(); Snd.startMusic();
  $('title').hidden = true; $('hud').hidden = false; state = 'play'; curZone = -1;
  camX = clamp(P.x - W * .4, 0, WORLD_W - W);
}
function start(data) {
  const snap = data && data.started && data.letters && data.letters.length === 5 ? data : null;
  buildSprites(); fillIcons(); buildSky(); resetGame(snap); layout();
  $('titleText').textContent = STORY.title; document.title = STORY.title;
  $('subText').textContent = UI.sub;
  $('imgHer').src = SPR.her.idle[0].toDataURL(); $('imgHim').src = SPR.him.idle[1].toDataURL(); $('imgHeart').src = SPR.heart.toDataURL();
  $('startLabel').textContent = snap ? UI.cont : UI.start;
  $('startBtn').addEventListener('click', beginPlay);
  $('mute').addEventListener('click', e => { e.stopPropagation(); toggleMute(); });
  $('letterPaper').addEventListener('pointerdown', e => { e.preventDefault(); advanceDlg(); });
  $('choice0').addEventListener('click', () => choose(0));
  $('choice1').addEventListener('click', () => choose(1));
  $('againBtn').addEventListener('click', () => { $('endCard').hidden = true; resetGame(null); beginPlay(); });
  bindPad();
  addEventListener('resize', layout);
  if (window.visualViewport) visualViewport.addEventListener('resize', layout);
  try { window.claude?.hot?.snapshot?.(snapshot); } catch (_) {}
  requestAnimationFrame(frame);
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
